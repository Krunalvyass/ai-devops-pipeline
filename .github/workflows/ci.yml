name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app tests

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t ai-devops-app .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.69.2 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ai-devops-app

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag ai-devops-app "$DOCKERHUB_USERNAME/ai-devops-app:latest"
          docker tag ai-devops-app "$DOCKERHUB_USERNAME/ai-devops-app:${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/ai-devops-app:latest"
          docker push "$DOCKERHUB_USERNAME/ai-devops-app:${{ github.sha }}"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Pull the published image
        run: docker pull "$DOCKERHUB_USERNAME/ai-devops-app:${{ github.sha }}"

      - name: Start the container
        run: docker run -d --name app -p 8000:8000 "$DOCKERHUB_USERNAME/ai-devops-app:${{ github.sha }}"

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs app
          exit 1